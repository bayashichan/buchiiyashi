<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整理券 | ぶち癒しフェスタ in 東京</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../style.css">

    <!--
        整理券の表示は申込ページと統合したため、このページは案内用に残している。
        すでにLINEで送った案内や、リッチメニューにこのURLが入っている可能性があるため、
        リンク切れにせず転送する。JSが無効でも meta refresh で移動する。
    -->
    <meta http-equiv="refresh" content="0;url=../">
</head>

<body>
    <div class="wrap">
        <div class="loading">
            <div class="spinner"></div>
            <div>整理券のページへ移動しています…</div>
            <p class="print-hint">
                自動で移動しない場合は<a href="../">こちら</a>をお開きください。
            </p>
        </div>
    </div>

    <script>
        // 同じLIFFアプリの中の移動なので、ログイン状態はそのまま引き継がれる
        window.location.replace('../');
    </script>
</body>

</html>
