name = "buchiiyashi-festa-form"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 環境変数（デプロイ時に設定）
[vars]
GAS_URL = "https://script.google.com/macros/s/AKfycbxQ5ug6NBUBsS7cIb7_XaJF6-1-ei5kSPOaf49S20SkcICC6G8rzpNUYDKL27PuYdFMzA/exec"
R2_PUBLIC_URL = "https://pub-66037ae487194387bd8941466131ce7c.r2.dev"
GITHUB_REPO = "bayashichan/buchiiyashi"

# LINE管理アプリ(line-manager)連携。未設定なら連携をスキップする
LINE_MANAGER_URL = "https://line-manager-omega.vercel.app"
LINE_MANAGER_SOURCE = "buchiiyashi-apply"
LINE_MANAGER_CHANNEL_ID = "e5fae09e-25e3-44dd-9e61-3c5dbbb8afe0"

# 以下はwrangler secretで設定が必要:
# - ADMIN_PASSWORD: 管理画面ログインパスワード
# - GITHUB_TOKEN: GitHub Personal Access Token (repo権限)
# - GOOGLE_SA_KEY: サービスアカウントJSON (Base64エンコード)
# - GAS_SCRIPT_ID: Apps ScriptのスクリプトID
# - LINE_MANAGER_SECRET: line-manager側のAPPLICANT_INGEST_SECRETと同じ値
# - LINE_CHANNEL_ACCESS_TOKEN: 公式LINE(Messaging API)のチャネルアクセストークン。
#   申込完了をLINEでも本人へ通知するために使う。未設定なら通知をスキップする（メールのみ）。
#   （このファイルはpublicリポジトリにあるため平文で書かないこと）
#
# SNS一括投稿（/admin/sns/）で使うシークレット。設定手順は admin/sns/setup.html（サイト上の /admin/sns/setup.html）を参照:
# - FB_PAGE_ID           : 投稿先Facebookページのページ ID
# - FB_PAGE_ACCESS_TOKEN : 上記ページの長期ページアクセストークン
# - IG_USER_ID           : Instagramビジネスアカウントの ID
# - IG_ACCESS_TOKEN      : 省略可。未設定なら FB_PAGE_ACCESS_TOKEN を使う

# R2バケットバインディング
# 画像置き場に加えて、SNS予約投稿のジョブ保存にも使う
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "buchiiyashi-images"

# 予約投稿の実行トリガー（5分ごとに予約時刻を過ぎた投稿を処理する）
[triggers]
crons = ["*/5 * * * *"]
