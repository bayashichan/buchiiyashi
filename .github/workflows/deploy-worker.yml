name: Deploy Worker

# main に worker 配下（または本ワークフロー）が変更されたら
# Cloudflare Workers へ自動デプロイする。
# 手動実行（workflow_dispatch）も可能。
#
# 必要な GitHub Secrets（Settings > Secrets and variables > Actions で登録）:
#   - CLOUDFLARE_API_TOKEN : "Edit Cloudflare Workers" 権限を持つ API トークン
#   - CLOUDFLARE_ACCOUNT_ID: 対象アカウントの Account ID
#
# 注意:
#   Worker のシークレット（ADMIN_PASSWORD / GITHUB_TOKEN / GOOGLE_SA_KEY /
#   GAS_SCRIPT_ID）は Cloudflare 側に保存済みで、deploy では消えません。

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# 同時実行を抑止（後発の push を優先）
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 整理券の番号割り当てが壊れると当日そのまま受付の事故になるため、
      # デプロイの前に必ず通す。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: node --test "worker/test/**/*.test.mjs"

      # D1を作る前にデプロイすると、Cloudflareからは
      # 「binding TICKETS_DB of type d1 must have a valid database_id」という
      # エラーコードだけが返り、何をすればよいか分からない。ここで先に止める。
      - name: Check D1 database_id
        run: |
          if grep -q 'PLACEHOLDER_RUN_WRANGLER_D1_CREATE' worker/wrangler.toml; then
            echo "::error::D1データベースが未作成です。worker/wrangler.toml の database_id がプレースホルダのままなのでデプロイできません。手順は ticket/README.md の「1. データベースを作る」を参照してください。"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
